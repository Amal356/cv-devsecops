# Étape 181 : le secret Vault devsecops/api devient le Secret Kubernetes « api-secrets »
# déjà utilisé par le Deployment de l'API (variable API_DEMO_TOKEN) : aucune modification de l'API.
# refreshInterval : ESO relit Vault toutes les 15 s (rotation, étape 184)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-secrets
  namespace: devsecops-portfolio
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: api-secrets
    creationPolicy: Owner        # le Secret est créé et géré par ESO
  data:
    - secretKey: API_DEMO_TOKEN
      remoteRef:
        key: devsecops/api
        property: API_DEMO_TOKEN
