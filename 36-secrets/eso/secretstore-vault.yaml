# Étape 181 : connexion à Vault (moteur KV v2 « secret »), authentification Kubernetes
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: devsecops-portfolio
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-devsecops
          serviceAccountRef:
            name: eso-vault
