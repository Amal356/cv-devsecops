# Étape 182 : connexion à Secrets Manager de Floci
# L'adresse de Floci est donnée au contrôleur ESO (variable AWS_SECRETSMANAGER_ENDPOINT,
# voir l'installation Helm). Identifiants fictifs « test » acceptés par Floci (aucun compte AWS).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: floci-secrets-manager
  namespace: devsecops-portfolio
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: floci-credentials
            key: access-key
          secretAccessKeySecretRef:
            name: floci-credentials
            key: secret-key
