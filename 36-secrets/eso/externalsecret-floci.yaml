# Étape 182 : le secret Floci « devsecops/contact » devient le Secret Kubernetes « contact-secrets »
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: contact-secrets
  namespace: devsecops-portfolio
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: floci-secrets-manager
    kind: SecretStore
  target:
    name: contact-secrets
    creationPolicy: Owner
  data:
    - secretKey: CONTACT_WEBHOOK_TOKEN
      remoteRef:
        key: devsecops/contact
        property: CONTACT_WEBHOOK_TOKEN
