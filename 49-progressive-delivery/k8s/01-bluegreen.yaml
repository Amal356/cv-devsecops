# Étape 244 : stratégie Blue/Green.
# La nouvelle version (green) démarre à côté de l'ancienne (blue) et n'est visible que par le Service
# « preview ». Après vérification, la promotion bascule TOUT le trafic du Service « active » d'un coup ;
# l'ancienne version reste prête 2 minutes pour un retour arrière instantané.
apiVersion: v1
kind: Service
metadata:
  name: api-bg-active
  namespace: portfolio-rollouts
  labels: { demo: progressive-delivery }
spec:
  selector: { app: api-bg }
  ports: [{ name: http, port: 4000, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: api-bg-preview
  namespace: portfolio-rollouts
  labels: { demo: progressive-delivery }
spec:
  selector: { app: api-bg }
  ports: [{ name: http, port: 4000, targetPort: http }]
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api-bg
  namespace: portfolio-rollouts
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: api-bg }
  strategy:
    blueGreen:
      activeService: api-bg-active
      previewService: api-bg-preview
      autoPromotionEnabled: false      # promotion manuelle après vérification de la preview
      scaleDownDelaySeconds: 120       # l'ancienne version reste 2 min pour un retour arrière immédiat
  template:
    metadata:
      labels: { app: api-bg }
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: localhost:8090/devsecops/devsecops-api:5c3545c@sha256:e09d624f22d5998d348244ac86c52a5f6f4840fd69b40ff9a9aa986cc0c5504d
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: DATABASE_URL }
            - name: API_DEMO_TOKEN
              valueFrom:
                secretKeyRef: { name: api-secrets, key: API_DEMO_TOKEN }
          envFrom:
            - configMapRef:
                name: api-config
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
# Accès par l'Ingress Traefik : active et preview
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: api-bg
  namespace: portfolio-rollouts
spec:
  entryPoints: [web]
  routes:
    - match: Host(`bluegreen.portfolio.local`)
      kind: Rule
      services: [{ name: api-bg-active, port: 4000 }]
    - match: Host(`preview.bluegreen.portfolio.local`)
      kind: Rule
      services: [{ name: api-bg-preview, port: 4000 }]
