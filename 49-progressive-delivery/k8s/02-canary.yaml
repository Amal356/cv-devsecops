# Étapes 245 à 247 : stratégie Canary avec répartition du trafic par Traefik (10 % -> 25 % -> 50 % -> 100 %)
# et analyse Prometheus en continu : si le taux d'erreurs 5xx de la version canary dépasse 5 %,
# Argo Rollouts annule automatiquement (tout le trafic revient à la version stable).
apiVersion: v1
kind: Service
metadata:
  name: api-canary-stable
  namespace: portfolio-rollouts
  labels: { demo: progressive-delivery }
spec:
  selector: { app: api-canary }
  ports: [{ name: http, port: 4000, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: api-canary-canary
  namespace: portfolio-rollouts
  labels: { demo: progressive-delivery }
spec:
  selector: { app: api-canary }
  ports: [{ name: http, port: 4000, targetPort: http }]
---
# Service pondéré de Traefik : Argo Rollouts y écrit les poids stable / canary à chaque étape
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: api-canary-poids
  namespace: portfolio-rollouts
spec:
  weighted:
    services:
      - name: api-canary-stable
        port: 4000
        weight: 100
      - name: api-canary-canary
        port: 4000
        weight: 0
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: api-canary
  namespace: portfolio-rollouts
spec:
  entryPoints: [web]
  routes:
    - match: Host(`canary.portfolio.local`)
      kind: Rule
      services: [{ name: api-canary-poids, kind: TraefikService }]
---
# Étape 247 : analyse Prometheus (part des réponses 5xx de la version canary sur 1 minute)
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: taux-erreurs-api
  namespace: portfolio-rollouts
spec:
  metrics:
    - name: taux-erreurs-5xx
      interval: 20s
      failureLimit: 1                   # 2 mesures en échec -> rollback automatique
      successCondition: result[0] <= 0.05
      provider:
        prometheus:
          address: http://kps-kube-prometheus-stack-prometheus.monitoring.svc:9090
          query: |
            (sum(rate(http_requests_total{namespace="portfolio-rollouts",service="api-canary-canary",status_code=~"5.."}[1m])) or vector(0))
            /
            (sum(rate(http_requests_total{namespace="portfolio-rollouts",service="api-canary-canary"}[1m])) > 0 or vector(1))
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api-canary
  namespace: portfolio-rollouts
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: api-canary }
  strategy:
    canary:
      stableService: api-canary-stable
      canaryService: api-canary-canary
      trafficRouting:
        traefik:
          weightedTraefikServiceName: api-canary-poids
      analysis:                          # analyse en arrière-plan pendant toute la progression
        templates: [{ templateName: taux-erreurs-api }]
        startingStep: 1
      steps:                             # étape 246 : 10 % -> 25 % -> 50 % -> 100 %
        - setWeight: 10
        - pause: { duration: 60s }
        - setWeight: 25
        - pause: { duration: 60s }
        - setWeight: 50
        - pause: { duration: 60s }
        - setWeight: 100
  template:
    metadata:
      labels: { app: api-canary }
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: localhost:8090/devsecops/devsecops-api:5c3545c@sha256:e09d624f22d5998d348244ac86c52a5f6f4840fd69b40ff9a9aa986cc0c5504d
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: DATABASE_URL }
            - name: API_DEMO_TOKEN
              valueFrom:
                secretKeyRef: { name: api-secrets, key: API_DEMO_TOKEN }
          envFrom:
            - configMapRef:
                name: api-config
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
