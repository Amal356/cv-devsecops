# Étape 168 : seules ces communications sont autorisées
#   frontend -> API (4000)     API -> PostgreSQL (5432)
#   Traefik (Ingress, namespace kube-system) -> frontend et API
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-depuis-frontend-et-ingress
  namespace: devsecops-portfolio
spec:
  podSelector:
    matchLabels: { app: api }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: frontend }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - port: 4000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-depuis-api
  namespace: devsecops-portfolio
spec:
  podSelector:
    matchLabels: { app: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: api }
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-depuis-ingress
  namespace: devsecops-portfolio
spec:
  podSelector:
    matchLabels: { app: frontend }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - port: 3000
