# Étape 170 : démonstration dans le cluster Cilium
#   serveur (nginx) + client autorisé (role=client) + intrus (sans label client)
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serveur
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: serveur }
  template:
    metadata:
      labels: { app: serveur }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: serveur
  namespace: demo
spec:
  selector: { app: serveur }
  ports:
    - port: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: demo
  labels: { role: client }
spec:
  containers:
    - name: curl
      image: curlimages/curl:8.11.1
      command: ["sleep", "infinity"]
---
apiVersion: v1
kind: Pod
metadata:
  name: intrus
  namespace: demo
  labels: { role: intrus }
spec:
  containers:
    - name: curl
      image: curlimages/curl:8.11.1
      command: ["sleep", "infinity"]
