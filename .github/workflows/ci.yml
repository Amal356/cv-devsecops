name: CI DevSecOps

on:
  push:
  pull_request:

# Étape 76 : aucun droit par défaut, chaque job demande le strict nécessaire
permissions: {}

jobs:
  tests-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  tests-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: portfolio-next
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  # ---------------------------------------------------------------- Activité 6, étape 116 : tests d'intégration contre Floci
  tests-floci:
    name: tests-floci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      floci:                       # service container : Floci démarre avant le job, sans compte AWS
        image: floci/floci:2.4.0
        ports:
          - 4566:4566
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test      # identifiants fictifs
      AWS_SECRET_ACCESS_KEY: test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - name: Attendre Floci
        run: |
          for i in $(seq 1 30); do
            aws sts get-caller-identity > /dev/null 2>&1 && echo "Floci prêt" && exit 0
            sleep 1
          done
          echo "Floci ne répond pas"; exit 1
      - name: Tests d'intégration API -> SQS + S3
        run: npm run test:floci

  # ---------------------------------------------------------------- Activité 6, étapes 129-130 : analyse du code Terraform (IaC)
  iac-scan:
    name: iac-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy IaC (Terraform) - bloque les erreurs HIGH et CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_MISCONFIG_SCANNERS: terraform   # uniquement le code Terraform
        with:
          scan-type: config
          scan-ref: .
          trivyignores: .trivyignore
          severity: HIGH,CRITICAL
          exit-code: "1"

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"

  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install semgrep==1.182.1
      - name: Semgrep - rapport SARIF (toutes les alertes)
        run: |
          semgrep scan --config p/javascript --config p/dockerfile --config p/owasp-top-ten \
            --exclude node_modules --exclude .next --exclude '*.test.js' \
            --metrics off --sarif --output semgrep.sarif
      - name: Envoyer les alertes Semgrep dans Code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Semgrep - blocage sur les erreurs
        run: |
          semgrep scan --config p/javascript --config p/dockerfile --config p/owasp-top-ten \
            --exclude node_modules --exclude .next --exclude '*.test.js' \
            --severity ERROR --error --metrics off

  dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=critical
        working-directory: api
      - run: npm audit --omit=dev --audit-level=critical
        working-directory: portfolio-next
      - if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: critical
          comment-summary-in-pr: never

  image-scan:
    name: image-scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: api
          - image: portfolio
            context: portfolio-next
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Construire l'image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          load: true
          tags: devsecops-${{ matrix.image }}:${{ github.sha }}
      - name: Scanner l'image avec Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: devsecops-${{ matrix.image }}:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # ---------------------------------------------------------------- Étapes 83-84 : semantic-release
  release:
    name: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests-api, tests-frontend, secrets, sast, dependencies, image-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write # création du tag et de la release GitHub
    outputs:
      version: ${{ steps.semrel.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - name: semantic-release
        id: semrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  # ---------------------------------------------------------------- Étapes 89, 96-101 : images multi-arch signées dans GHCR
  publish:
    name: publish (${{ matrix.image }})
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write       # ajout du SBOM à la release (étape 98)
      packages: write       # push dans GHCR
      id-token: write       # signature Cosign keyless et attestation (jeton OIDC)
      attestations: write   # attestation de provenance (étape 101)
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: api
          - image: portfolio
            context: portfolio-next
    env:
      IMAGE: ghcr.io/amal356/devsecops-${{ matrix.image }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build et push multi-architecture (amd64 + arm64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Index multi-architecture (imagetools inspect)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker buildx imagetools inspect "${IMAGE}@${DIGEST}"

      - name: SBOM Syft (SPDX JSON), conservé comme artefact
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.image }}-${{ env.VERSION }}.spdx.json
          artifact-name: sbom-${{ matrix.image }}.spdx.json
          upload-release-assets: false
      - name: SBOM attaché à la release GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ matrix.image }}
        run: gh release upload "v${VERSION}" "sbom-${IMAGE_NAME}-${VERSION}.spdx.json" --clobber --repo "$GITHUB_REPOSITORY"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Signature Cosign keyless (identité OIDC du workflow)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes --recursive "${IMAGE}@${DIGEST}"

      - name: Attestation de provenance SLSA
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # ---------------------------------------------------------------- Étapes 100, 102, 104 : barrière avant déploiement
  verify-before-deploy:
    name: verify-before-deploy
    needs: [release, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read      # aucun accès en écriture
      packages: read      # lecture des images dans GHCR
      attestations: read  # lecture des attestations de provenance
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Vérifier signature et provenance des deux images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for image in api portfolio; do
            ref="ghcr.io/amal356/devsecops-${image}:${VERSION}"
            echo "::group::cosign verify ${ref}"
            cosign verify "${ref}" \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            echo "::endgroup::"
            echo "::group::gh attestation verify ${ref}"
            gh attestation verify "oci://${ref}" --repo "$GITHUB_REPOSITORY"
            echo "::endgroup::"
          done
      - name: Déploiement (simulé)
        run: |
          echo "Images signées et de provenance vérifiée, déploiement de la version ${VERSION} autorisé."
