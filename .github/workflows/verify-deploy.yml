# Barrière de déploiement manuelle (Activité 5, étapes 100, 104, 105).
# Actions > « Vérifier avant déploiement » > Run workflow, puis saisir une image.
#   - une image publiée par ci.yml (signée, avec provenance) : déploiement autorisé ;
#   - une image non signée, ou signée par quelqu'un d'autre : le job échoue, rien n'est déployé.
name: Vérifier avant déploiement

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image à déployer (ex. ghcr.io/amal356/devsecops-api:1.2.0)"
        required: true
        type: string

permissions: {}

jobs:
  gate:
    name: verify-signature
    runs-on: ubuntu-latest
    permissions:
      contents: read      # aucun accès en écriture
      packages: read      # lecture de l'image dans GHCR
      attestations: read  # lecture de l'attestation de provenance
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Signature Cosign (identité = ci.yml de ce dépôt, branche main)
        env:
          IMAGE: ${{ inputs.image }} # passé par variable d'environnement, pas d'injection dans le script
        run: |
          cosign verify "$IMAGE" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Provenance (attestation SLSA générée par GitHub Actions)
        env:
          IMAGE: ${{ inputs.image }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh attestation verify "oci://${IMAGE}" --repo "$GITHUB_REPOSITORY"
      - name: Déploiement (simulé)
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          echo "Image vérifiée, déploiement autorisé : $IMAGE"
