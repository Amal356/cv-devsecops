version: 2
updates:
  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(deps)"
    groups:
      api-mineures:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /portfolio-next
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(deps)"
    groups:
      frontend-mineures:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/api, /portfolio-next]
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(docker)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
