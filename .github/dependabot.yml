# Dependabot (étape 75) : propose chaque semaine des Pull Requests de mise à jour.
# Les mises à jour de SÉCURITÉ sont proposées dès qu'une alerte apparaît
# (Settings > Code security > Dependabot security updates).
version: 2
updates:
  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      api-mineures:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /portfolio-next
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      frontend-mineures:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps-dev)"

  - package-ecosystem: docker
    directories: [/api, /portfolio-next]
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(docker)"

  # Garde les Actions épinglées par SHA à jour (le commentaire « # vX.Y.Z » est mis à jour aussi)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
