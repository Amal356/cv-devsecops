# 2. Constraint : application du modèle aux Pods et Deployments du namespace du portfolio
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sInterdireTagLatest
metadata:
  name: interdire-tag-latest
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
      - apiGroups: ["apps"]
        kinds: ["Deployment"]
    namespaces: ["devsecops-portfolio"]
