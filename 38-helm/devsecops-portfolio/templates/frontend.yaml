apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
    {{- include "portfolio.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.frontend }}
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels:
        app: frontend
        {{- include "portfolio.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmaps.yaml") . | sha256sum }}
    spec:
      {{- include "portfolio.podSecurity" . | nindent 6 }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image }}:{{ .Values.frontend.tag }}"
          imagePullPolicy: {{ .Values.frontend.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef: { name: frontend-config }
          {{- include "portfolio.containerSecurity" . | nindent 10 }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          # timeoutSeconds 8 : la page peut attendre l'API jusqu'à 2 x 3 s (activité 7)
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 8
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 8
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: next-cache, mountPath: /app/.next/cache }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: next-cache, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
    {{- include "portfolio.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: { app: frontend }
  ports:
    - { name: http, port: 3000, targetPort: 3000 }
