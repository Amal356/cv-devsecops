{{- if .Values.ingress.enabled }}
# HTTPS (entrée websecure de Traefik) : / → frontend, /api → API
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio
  labels:
    {{- include "portfolio.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecret }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: api, port: { number: 4000 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend, port: { number: 3000 } } }
{{- if .Values.ingress.redirectHttpToHttps }}
---
# HTTP (entrée web) redirigé vers HTTPS – Ingress séparé pour éviter la boucle (activité 7)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirection-https
  labels:
    {{- include "portfolio.labels" . | nindent 4 }}
spec:
  redirectScheme: { scheme: https, permanent: true }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-redirection
  labels:
    {{- include "portfolio.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-redirection-https@kubernetescrd
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend, port: { number: 3000 } } }
{{- end }}
{{- end }}
