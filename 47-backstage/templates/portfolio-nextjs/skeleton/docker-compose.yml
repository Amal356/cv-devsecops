# Déploiement local du Portfolio (lancé par le pipeline : docker compose --env-file deploy.env up -d)
name: portfolio-nextjs
services:
  portfolio:
    image: ${DOCKERHUB_USER}/portfolio-nextjs:${IMAGE_TAG:-latest}
    container_name: portfolio-nextjs
    ports:
      - "3000:3000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
