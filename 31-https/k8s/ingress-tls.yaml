# Étape 155 : accès en HTTPS (https://portfolio.local) avec le certificat portfolio-tls
#   Ingress « portfolio »               : HTTPS uniquement (entrée websecure de Traefik, port 443)
#   Ingress « portfolio-redirection »   : HTTP (entrée web, port 80) redirigé vers HTTPS
# Deux Ingress séparés : la redirection ne s'applique jamais au trafic déjà en HTTPS (pas de boucle)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio
  namespace: devsecops-portfolio
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts: [portfolio.local]
      secretName: portfolio-tls
  rules:
    - host: portfolio.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port: { number: 4000 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 3000 }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirection-https
  namespace: devsecops-portfolio
spec:
  redirectScheme:
    scheme: https
    permanent: true        # 301 vers https://portfolio.local (port 443)
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-redirection
  namespace: devsecops-portfolio
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: devsecops-portfolio-redirection-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: portfolio.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 3000 }
