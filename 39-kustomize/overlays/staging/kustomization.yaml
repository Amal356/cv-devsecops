# Étapes 197-198 : environnement STAGING – 2 replicas
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: portfolio-staging
resources:
  - namespace.yaml
  - ../../base
labels:
  - pairs: { environment: staging }
    includeSelectors: false
replicas:
  - name: frontend
    count: 2
  - name: api
    count: 2
configMapGenerator:
  - name: frontend-config
    behavior: merge
    literals:
      # étape 198 : API_URL propre à l'environnement (nom DNS complet du Service de l'API)
      - API_URL=http://api.portfolio-staging.svc.cluster.local:4000
  - name: api-config
    behavior: merge
    literals:
      - CORS_ORIGIN=http://staging.portfolio.local:8088,http://staging.portfolio.local
patches:
  - target: { kind: Ingress, name: portfolio }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.portfolio.local
