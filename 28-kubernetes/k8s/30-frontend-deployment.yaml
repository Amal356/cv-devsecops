# Étape 139 : Deployment du frontend Next.js
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: devsecops-portfolio
  labels: { app: frontend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: devsecops-portfolio:1.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            # Étape 143 : le frontend appelle l'API par le nom du Service Kubernetes (DNS du cluster)
            - name: API_URL
              value: http://api:4000
