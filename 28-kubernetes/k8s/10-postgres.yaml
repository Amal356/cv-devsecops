# Base PostgreSQL de l'API (version simple ; PVC détaillé à l'étape 150)
# Le mot de passe vient du Secret « postgres-credentials », créé par commande (jamais dans Git).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: devsecops-portfolio
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path        # provisionneur de volumes fourni par K3s
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: devsecops-portfolio
  labels: { app: postgres }
spec:
  replicas: 1
  strategy: { type: Recreate }        # un seul Pod à la fois sur le volume
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef: { name: postgres-credentials }   # POSTGRES_USER / PASSWORD / DB
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: devsecops-portfolio
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
