# Portfolio complet : frontend Next.js + API Express + PostgreSQL
# Préparation : cp .env.example .env  (puis choisir un mot de passe PostgreSQL)
# Lancement   : docker compose -f docker-compose.fullstack.yml up -d --build
name: devsecops-portfolio

services:
  db:
    image: postgres:16-alpine
    container_name: devsecops-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amal}
      # Aucun mot de passe dans Git : il vient du fichier .env (non versionné)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans le fichier .env}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio_db}
    volumes:
      - db-data:/var/lib/postgresql/data   # les messages survivent à "docker compose down"
    ports:
      - "127.0.0.1:5432:5432"   # accessible depuis la VM uniquement (psql, tests d'intégration)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - portfolio-net

  api:
    build: ./api
    image: devsecops-api
    container_name: devsecops-api
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-amal}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-portfolio_db}?schema=public
      # Origine du navigateur qui affiche le portfolio (formulaire de contact)
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "4000:4000"   # le navigateur envoie le formulaire de contact directement à l'API
    depends_on:
      db:
        condition: service_healthy   # attend que PostgreSQL accepte les connexions
    restart: unless-stopped
    networks:
      - portfolio-net

  frontend:
    build:
      context: ./portfolio-next
      args:
        # Adresse de l'API vue par le navigateur (intégrée au build Next.js)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    image: devsecops-portfolio
    container_name: devsecops-portfolio
    environment:
      # "api" = nom du service ci-dessus, résolu par le DNS du réseau Docker Compose
      API_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy   # attend que /api/health réponde
    restart: unless-stopped
    networks:
      - portfolio-net

networks:
  portfolio-net:
    driver: bridge

volumes:
  db-data:
