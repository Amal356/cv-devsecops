# Étape 162 : droits minimaux. L'application peut seulement LIRE ses deux ConfigMaps.
# Aucun accès aux Secrets, aux Pods ni aux autres ressources.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lecture-configuration
  namespace: devsecops-portfolio
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["api-config", "frontend-config"]
    verbs: ["get"]
