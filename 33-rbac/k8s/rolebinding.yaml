# Étape 163 : le Role est accordé au ServiceAccount, dans ce namespace uniquement
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devsecops-app-lecture-configuration
  namespace: devsecops-portfolio
subjects:
  - kind: ServiceAccount
    name: devsecops-app
    namespace: devsecops-portfolio
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lecture-configuration
