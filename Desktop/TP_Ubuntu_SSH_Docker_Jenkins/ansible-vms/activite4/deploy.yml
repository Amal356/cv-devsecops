---
- name: Déployer le DevSecOps Portfolio
  hosts: all
  become: true
  vars:
    project_dir: /opt/cv-devsecops

  tasks:
    - name: Mettre à jour apt
      apt: update_cache=yes

    - name: Supprimer les paquets Docker conflictuels d'Ubuntu
      apt:
        name:
          - docker.io
          - docker-compose
          - docker-compose-v2
          - docker-doc
          - podman-docker
          - containerd
          - runc
        state: absent

    - name: Installer les prérequis
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
        state: present

    - name: Créer le dossier des clés APT
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Télécharger la clé GPG de Docker
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Ajouter le dépôt officiel de Docker
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        filename: docker
        state: present

    - name: Installer Docker Engine et Compose
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Démarrer et activer Docker
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Ajouter vagrant au groupe docker
      user:
        name: vagrant
        groups: docker
        append: true

    - name: Cloner le dépôt cv-devsecops
      git:
        repo: https://github.com/Amal356/cv-devsecops.git
        dest: "{{ project_dir }}"
        version: main
        force: true

    - name: Lancer le Portfolio avec Docker Compose
      command: docker compose up -d --build
      args:
        chdir: "{{ project_dir }}"